name: checks

on:
  pull_request:
  push:
    branches: [main]

# Superseded PR runs are cancelled; every push to main runs to completion.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  pre-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    env:
      CARGO_NET_GIT_FETCH_WITH_CLI: true
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: ./.github/actions/setup-rust-node
        with:
          rust-components: rustfmt clippy
      - name: Install JS dependencies
        run: pnpm install --ignore-scripts
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
      - name: Install pre-commit
        run: python -m pip install pre-commit
      - name: Run pre-commit
        run: pre-commit run --all-files --show-diff-on-failure

  npm-tests:
    name: npm-tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
      - name: Test npm launcher and installer
        run: node --test npm/tests/runtime.test.cjs
      - name: Test npm package generation and installation
        if: runner.os == 'Linux'
        run: node --test npm/tests/packages.test.mjs

  core-tests:
    name: core-tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    permissions:
      contents: read
    env:
      CARGO_NET_GIT_FETCH_WITH_CLI: true
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: ./.github/actions/setup-rust-node
        with:
          rust-cache-key: tests
      - name: Install JS dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Run all unit tests
        run: cargo test --locked --bin bt
      - name: Test custom view CLI and preview callbacks
        run: |
          cargo test --locked --test cli custom_views
          node --test scripts/custom-views-preview.test.mjs

  eval-tests-go:
    name: eval-tests-go
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    env:
      CARGO_NET_GIT_FETCH_WITH_CLI: true
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: ./.github/actions/setup-rust-node
        with:
          rust-cache-key: tests
      - name: Install JS dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts
      # No Go toolchain is installed on purpose: these tests stub `go` through
      # BT_EVAL_GO_BIN, so they stay hermetic and fast. Exercising a real
      # `go run` would need a fixture under tests/evals/go plus actions/setup-go.
      - name: Run Go eval unit tests
        run: "cargo test --bin bt -- eval::tests::go:: go_runner::tests::"

  eval-tests-node:
    name: eval-tests-node (node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        node-version: ["20", "22", "24"]
    permissions:
      contents: read
    env:
      CARGO_NET_GIT_FETCH_WITH_CLI: true
      BT_EVAL_REQUIRED_RUNTIMES: node,bun,deno
      BT_EVAL_FIXTURE_RUNTIMES: node,bun,deno
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: ./.github/actions/setup-rust-node
        with:
          mise-tools: rust node pnpm bun
          rust-cache-key: tests
          node-version: ${{ matrix.node-version }}
      - uses: denoland/setup-deno@667a34cdef165d8d2b2e98dde39547c9daac7282 # v2.0.4
        with:
          deno-version: v2.x
      - name: Install JS toolchain dependencies
        run: pnpm install --ignore-scripts
      - name: Run eval fixtures
        run: cargo test --test eval_fixtures
      - name: Run functions fixtures
        run: cargo test --test functions

  eval-tests-python:
    name: eval-tests-python (py ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    permissions:
      contents: read
    env:
      CARGO_NET_GIT_FETCH_WITH_CLI: true
      BT_EVAL_REQUIRED_RUNTIMES: python
      BT_EVAL_FIXTURE_RUNTIMES: python
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: ./.github/actions/setup-rust-node
        with:
          mise-tools: rust node pnpm uv
          rust-cache-key: tests
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install JS dependencies
        run: pnpm install --ignore-scripts
      - name: Run eval fixtures
        run: cargo test --test eval_fixtures

  # Single aggregate status for branch protection: mark only `checks-passed` as
  # required. Every other job in this workflow must be listed in `needs`.
  checks-passed:
    name: checks-passed
    needs:
      - pre-commit
      - npm-tests
      - core-tests
      - eval-tests-go
      - eval-tests-node
      - eval-tests-python
    runs-on: ubuntu-latest
    timeout-minutes: 60
    if: always()
    permissions: {}
    steps:
      - name: Verify all required checks passed
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          failed=$(echo "$NEEDS" | jq -r '[to_entries[] | select(.value.result != "success" and .value.result != "skipped") | .key] | join(" ")')
          if [ -n "$failed" ]; then
            echo "::error::Required checks did not pass: $failed"
            exit 1
          fi
          echo "All required checks passed"
