name: Set up Rust toolchain
description: Install the Rust version pinned in .tool-versions and any requested targets.
inputs:
  targets:
    description: Comma-separated Rust targets to install
    required: false
    default: ""
runs:
  using: composite
  steps:
    - name: Install the pinned Rust toolchain
      shell: bash
      env:
        RUST_TARGETS: ${{ inputs.targets }}
      run: |
        set -euo pipefail
        version=$(awk '$1 == "rust" { print $2 }' .tool-versions)
        if [[ -z "$version" ]]; then
          echo "Rust version is missing from .tool-versions" >&2
          exit 1
        fi
        if ! command -v rustup > /dev/null 2>&1; then
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --no-modify-path --default-toolchain none
          export PATH="$HOME/.cargo/bin:$PATH"
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
        fi
        rustup toolchain install "$version" --profile minimal
        if [[ -n "$RUST_TARGETS" ]]; then
          IFS=, read -ra targets <<< "$RUST_TARGETS"
          rustup target add --toolchain "$version" "${targets[@]}"
        fi
        echo "RUSTUP_TOOLCHAIN=$version" >> "$GITHUB_ENV"
