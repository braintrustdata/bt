[package]
name = "bt"
version = "0.29.0"
edition = "2021"
rust-version = "1.97.0"
authors = ["Braintrust engineering <eng@braintrust.dev>"]
description = "The Braintrust command line interface"
license = "Apache-2.0"
repository = "https://github.com/braintrustdata/bt"

[package.metadata.wix]
upgrade-guid = "5B558F98-EEBD-4F5E-A0C8-E7A039445139"
path-guid = "7CD3044D-A62A-469C-8552-0E5C3A00FFF1"
license = false
eula = false

[dependencies]
actix-web = "4.11.0"
anyhow = "1.0.89"
braintrust-sdk-rust = { git = "https://github.com/braintrustdata/braintrust-sdk-rust", rev = "d9d351a040ebe3c85cdf965ca1849792e85d34cb" }
bt-daemon = { git = "https://github.com/braintrustdata/braintrust-coding-agent-plugins", rev = "055eedf7868eb773a576931ab131290d86913820" }
async-trait = "0.1"
clap = { version = "4.5.20", features = ["derive", "env", "string"] }
crossterm = "0.28.1"
futures-util = "0.3.31"
indicatif = "0.17.8"
ratatui = "0.30.2"
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
braintrust-api-client = { git = "https://github.com/braintrustdata/braintrust-sdk-rust", rev = "d9d351a040ebe3c85cdf965ca1849792e85d34cb" }
rustls-native-certs = "0.8"
serde = { version = "1.0.210", features = ["derive"] }
serde_json = "1.0.128"
yaml_serde = "0.10"
toml = "0.8"
sha2 = "0.10.8"
strip-ansi-escapes = "0.2.0"
tokio = { version = "1.40.0", features = ["rt-multi-thread", "macros", "process", "net", "signal", "sync"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
unicode-width = "0.1.13"
dialoguer = { version = "0.11", features = ["fuzzy-select"] }
fuzzy-matcher = "0.3"
dotenvy = "0.15"
open = "5"
regex = "1"
urlencoding = "2"
lingua = { git = "https://github.com/braintrustdata/lingua", rev = "3c79f2c427d12d3e2fe104910ef3c0768ad83770" }
comfy-table = "7.2.2"
base64 = "0.22"
oauth2 = { version = "4.4", default-features = false }
getrandom = "0.3"
chrono = { version = "0.4.40", features = ["clock"] }
dirs = "5"
dunce = "1"
pathdiff = "0.2.3"
glob = "0.3"
flate2 = "1.1.2"
fs2 = "0.4"
tempfile = "3"
uuid = { version = "1.21.0", features = ["v4"] }
zeroize = "1.9"
swc_bundler = "49.0.0"
swc_common = "21.0.2"
swc_ecma_ast = "23.0.1"
swc_ecma_codegen = "26.0.1"
swc_ecma_loader = { version = "22.0.0", features = ["node"] }
swc_ecma_parser = "39.1.0"
swc_ecma_transforms_base = "42.0.1"
swc_ecma_transforms_react = "47.0.0"
swc_ecma_transforms_typescript = "47.0.0"

[profile.dist]
inherits = "release"
lto = "thin"

[workspace]
members = ["."]

[dev-dependencies]
assert_cmd = "2.2.0"
predicates = "3.1.4"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_Globalization",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Security_Cryptography",
    "Win32_Storage_FileSystem",
    "Win32_Storage_Packaging_Appx",
    "Win32_System_Com",
    "Win32_System_Threading",
    "Win32_System_WindowsProgramming",
    "Win32_UI_Shell",
] }
